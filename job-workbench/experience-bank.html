<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>经历库 · 面试故事资产</title>
<meta name="description" content="把几段实习/项目的故事汇总成经历库：30 秒/90 秒版本、能力标签、待补证据、目标 JD 覆盖；数据只存本机。">
<style>
  :root{--ink:#1f1b16;--muted:#7a7268;--bg:#f7f2ea;--card:#fff;--line:#eadfd0;--accent:#ff7a45;--accent-soft:#ffe8dc;--ok:#0e6b58;--ok-soft:#e4f7ef;--warn:#9a4b00;--warn-soft:#fff4e2;--blue:#1f4fd8}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(900px 500px at 0% -10%,#ffe8dc,transparent 60%),radial-gradient(700px 400px at 110% 0%,#ffe9c9,transparent 55%),var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;min-height:100vh}
  .pbar{background:#f7f5f0;border-bottom:1px solid #e7e2d9}
  .pbar-in{max-width:1080px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.4;color:#6c675f}
  .pbar a{color:#6c675f;text-decoration:none;font-weight:600}.pbar a:hover{color:var(--blue)}.pbar b{color:#171614}.pbar-sp{flex:1}
  .wrap{max-width:1000px;margin:0 auto;padding:30px 18px 60px}
  .eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.08em;color:#b4541f;text-transform:uppercase;margin:0 0 10px}
  h1{font-size:clamp(28px,4.3vw,40px);line-height:1.18;margin:0 0 12px;letter-spacing:-.02em}
  .lede{color:var(--muted);font-size:15px;line-height:1.85;max-width:48em;margin:0 0 16px}
  .banner{background:var(--ok-soft);border:1px solid #bfe6d8;color:#145c4b;border-radius:14px;padding:11px 15px;font-size:13px;line-height:1.7;margin:14px 0 20px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
  @media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:0 8px 22px rgba(60,42,20,.06)}
  .stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--muted)}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0}
  .btn{display:inline-block;border:0;border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none;box-shadow:0 8px 18px rgba(255,122,69,.2)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.small{padding:7px 12px;font-size:12.5px}
  .btn:active{transform:scale(.985)}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.7}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:38px 22px;text-align:center}
  .empty h2{margin:0 0 8px;font-size:19px}.empty p{color:var(--muted);font-size:13.5px;line-height:1.8;margin:0 0 16px}
  .cover{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:16px 0}
  .cover h2{font-size:16px;margin:0 0 8px}.cover .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:#9a4b00;margin:2px 0}
  .tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.muted{background:#f0ece5;color:#6f675d}
  .story{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 10px 26px rgba(60,42,20,.07)}
  .story-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .story h2{font-size:19px;margin:0 0 4px}
  .story .meta{color:var(--muted);font-size:12.5px}
  .short{background:#fffdfa;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.2px;line-height:1.8;margin:12px 0}
  details{margin-top:8px}summary{cursor:pointer;font-weight:700;font-size:13px;color:#5d554b}
  .detail-body{margin-top:10px;font-size:13px;line-height:1.8;color:#3f3a33}
  .detail-body h4{font-size:13px;margin:12px 0 5px;color:#5d554b}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
  th,td{border:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}th{background:#f7f5f0;white-space:nowrap}td:first-child{white-space:nowrap;font-weight:700;color:#5d554b}
  ul{padding-left:18px;margin:5px 0}li{line-height:1.8}
  .gaps li{color:var(--warn)}
  .story-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1f1b16;color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:99}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  footer{text-align:center;color:#a89b8a;font-size:12px;margin-top:26px;line-height:1.9}
  @media(max-width:640px){.wrap{padding:20px 13px 45px}.story{padding:16px}.pbar-in{padding:8px 14px;font-size:12px}}
</style>
</head>
<body>
<div class="pbar"><div class="pbar-in"><a href="../">← 作品集</a><span class="pbar-sp"></span><a href="index.html">求职工作台</a><span class="pbar-sp"></span><a href="experience.html">经历深挖</a><span class="pbar-sp"></span><b>经历库</b><span class="pbar-sp"></span><a href="PRD.md">PRD</a></div></div>

<div class="wrap">
  <p class="eyebrow">求职副驾驶 · 故事资产</p>
  <h1>把几段实习，<br>变成一套面试故事库</h1>
  <p class="lede">「经历深挖」保存的故事会自动汇总在这里：每段 30 秒/90 秒版本、能力标签、待补证据，以及和目标 JD 的关键词覆盖。面试前 10 分钟过一遍，不用再翻简历。</p>
  <div class="banner">数据只存在本机浏览器；能力标签和 JD 覆盖是<b>规则匹配</b>，只做提示，不是结论。没有数字/证据的地方会保留“待补”。</div>

  <div class="stats" id="stats">
    <div class="stat"><b id="n-stories">0</b><span>段经历</span></div>
    <div class="stat"><b id="n-tags">0</b><span>能力标签</span></div>
    <div class="stat"><b id="n-gaps">0</b><span>待补证据</span></div>
    <div class="stat"><b id="n-cover">—</b><span>JD 关键词覆盖</span></div>
  </div>

  <div class="toolbar">
    <a class="btn" href="experience.html">＋ 再深挖一段经历</a>
    <button class="btn ghost small" id="btn-export">导出故事库 Markdown</button>
    <button class="btn ghost small" id="btn-clear">清空经历库</button>
    <span class="hint">保存后自动出现在这里</span>
  </div>

  <div class="cover" id="cover" style="display:none">
    <h2>目标 JD 覆盖（规则匹配）</h2>
    <p class="hint" id="cover-summary"></p>
    <div class="tags" id="cover-tags"></div>
  </div>

  <div id="list"></div>

  <footer>不自动投递 · 不编数字 · 数据留在本机 · <a href="index.html">回求职工作台</a></footer>
</div>
<div class="toast" id="toast"></div>

<script src="experience-core.js"></script>
<script>
(function () {
  'use strict';
  var CORE = window.ExperienceCore;
  var K_LIB = 'em_library_v1', K_JWB = 'jwb_state';
  var $ = function (id) { return document.getElementById(id); };
  var stories = [];

  function loadJSON(key) { try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
  function saveJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } }
  function esc(text) {
    return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function toast(text) {
    var el = $('toast'); el.textContent = text; el.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }
  function jdText() { var jwb = loadJSON(K_JWB) || {}; return (jwb.jd || '').trim(); }

  function render() {
    stories = (loadJSON(K_LIB) || []).filter(function (s) { return s && s.title; });
    var tags = {};
    var gaps = 0;
    stories.forEach(function (s) {
      (CORE.classifyStory(s) || []).forEach(function (x) { tags[x.tag] = (tags[x.tag] || 0) + 1; });
      gaps += (s.gaps || []).length;
    });
    $('n-stories').textContent = stories.length;
    $('n-tags').textContent = Object.keys(tags).length;
    $('n-gaps').textContent = gaps;
    var jd = jdText();
    if (jd && stories.length) {
      var cov = CORE.jdCoverage(stories, jd);
      $('n-cover').textContent = cov.expected.length ? (cov.covered.length + '/' + cov.expected.length) : '—';
      $('cover').style.display = '';
      $('cover-summary').textContent = cov.expected.length
        ? 'JD 里识别到这些能力方向：' + cov.expected.join('、') + '。已覆盖 ' + cov.covered.length + ' 项，缺口 ' + cov.gaps.length + ' 项。'
        : '没有从 JD 里识别到预设能力词，先跳过。';
      $('cover-tags').innerHTML = cov.expected.map(function (tag) {
        var ok = cov.covered.indexOf(tag) >= 0;
        return '<span class="tag ' + (ok ? 'ok' : 'warn') + '">' + (ok ? '✓ ' : '缺口 ') + esc(tag) + '</span>';
      }).join('');
    } else {
      $('n-cover').textContent = '—';
      $('cover').style.display = 'none';
    }
    if (!stories.length) {
      $('list').innerHTML = '<div class="empty"><h2>还没有保存的故事</h2><p>先去「经历深挖」用 5 个问题把一段实习聊成 STAR 故事，点「保存到经历库」，这里就会出现。</p><a class="btn" href="experience.html">开始深挖第一段 →</a></div>';
      return;
    }
    $('list').innerHTML = stories.map(function (s, i) {
      var tagHtml = (CORE.classifyStory(s) || []).slice(0, 5).map(function (x) { return '<span class="tag">' + esc(x.tag) + '</span>'; }).join('');
      var gapHtml = (s.gaps || []).length ? '<ul class="gaps">' + s.gaps.map(function (g) { return '<li>' + esc(g) + '</li>'; }).join('') + '</ul>' : '<p class="hint">没有明显待补；仍建议核对数字。</p>';
      var star = s.star || {};
      var probes = (s.probes || []).map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('');
      return '<article class="story" data-i="' + i + '">' +
        '<div class="story-head"><div><h2>' + esc(s.title) + '</h2><div class="meta">' + esc([s.role, s.period].filter(Boolean).join(' ｜ ')) + '</div></div><div class="tags">' + tagHtml + '</div></div>' +
        '<div class="short">' + esc((s.versions && s.versions.short) || '（30 秒版待补）') + '</div>' +
        '<details><summary>展开 STAR / 90 秒 / 追问 / 待补</summary><div class="detail-body">' +
        '<h4>STAR</h4><table><tbody>' +
        '<tr><td>S 情境</td><td>' + esc(star.S || '—') + '</td></tr>' +
        '<tr><td>T 任务</td><td>' + esc(star.T || '—') + '</td></tr>' +
        '<tr><td>A 行动</td><td>' + esc(star.A || '—') + '</td></tr>' +
        '<tr><td>R 结果</td><td>' + esc(star.R || '—') + '</td></tr>' +
        '</tbody></table>' +
        '<h4>90 秒版</h4><p>' + esc((s.versions && s.versions.long) || '—') + '</p>' +
        '<h4>可能追问</h4><ul>' + (probes || '<li>—</li>') + '</ul>' +
        '<h4>待补证据</h4>' + gapHtml +
        '</div></details>' +
        '<div class="story-actions"><button class="btn ghost small" data-copy="' + i + '">复制 30 秒</button><button class="btn ghost small" data-del="' + i + '">删除</button></div>' +
        '</article>';
    }).join('');
  }

  function copy30(i) {
    var s = stories[i]; if (!s) return;
    var text = (s.versions && s.versions.short) || '';
    if (!text) { toast('还没有 30 秒版'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制 30 秒版'); }, function () { fallback(text); });
    } else fallback(text);
  }
  function fallback(text) {
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败'); }
    ta.remove();
  }
  function del(i) {
    var s = stories[i]; if (!s) return;
    if (!confirm('删除「' + (s.title || '这段经历') + '」？')) return;
    var lib = loadJSON(K_LIB) || [];
    lib = lib.filter(function (x) { return x.id !== s.id; });
    saveJSON(K_LIB, lib); render(); toast('已删除');
  }
  function exportAll() {
    if (!stories.length) { toast('还没有故事'); return; }
    var text = CORE.buildLibraryMarkdown(stories, jdText());
    var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = '经历库-面试故事.md';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  $('btn-export').addEventListener('click', exportAll);
  $('btn-clear').addEventListener('click', function () {
    if (!stories.length) { toast('经历库已经是空的'); return; }
    if (!confirm('清空整个经历库？这个操作不可恢复。')) return;
    localStorage.removeItem(K_LIB); render(); toast('已清空');
  });
  $('list').addEventListener('click', function (e) {
    var copy = e.target.getAttribute('data-copy');
    var delIdx = e.target.getAttribute('data-del');
    if (copy != null) copy30(Number(copy));
    if (delIdx != null) del(Number(delIdx));
  });

  render();
})();
</script>
</body>
</html>
